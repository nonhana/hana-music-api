name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      mode:
        description: Release workflow mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - candidate
          - publish
      candidate_version:
        description: Exact version approved for candidate publication
        type: string
      candidate_sha256:
        description: SHA-256 of the approved npm tarball
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for offline browser verification
        run: bunx playwright install --with-deps chromium

      - name: Record checked out candidate
        run: |
          mkdir -p .artifacts/testing/ci
          git rev-parse HEAD > .artifacts/testing/ci/tested-head.txt
          bun -e 'import { fingerprint } from "./tests/_kit/evidence.ts"; await Bun.write(".artifacts/testing/ci/initial-candidate.json", JSON.stringify(await fingerprint()));'

      - name: Verify before release
        run: bun run verify:sdk 2>&1 | tee .artifacts/testing/ci/verify-sdk.log

      - name: Rehearse release preparation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: |
          bun run version-packages
          bun scripts/release-preflight.mts

      - name: Check approved candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'candidate' }}
        env:
          HANA_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          HANA_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          bun -e '
          import { createHash } from "node:crypto";
          const pkg = await Bun.file("package.json").json();
          const pre = await Bun.file(".changeset/pre.json").json();
          const active = [...new Bun.Glob("*.md").scanSync({ cwd: ".changeset" })]
            .filter(path => path !== "README.md");
          if (
            pkg.version !== process.env.HANA_CANDIDATE_VERSION ||
            !/^\d+\.\d+\.\d+-next\.\d+$/.test(pkg.version) ||
            pre.mode !== "pre" ||
            pre.tag !== "next" ||
            active.length ||
            pkg.publishConfig?.provenance !== true
          ) throw new Error("candidate version, tag or Changesets state is not approved");
          const packed = Bun.spawnSync([
            "npm", "pack", "--json", "--pack-destination", ".artifacts/testing/ci"
          ]);
          if (packed.exitCode !== 0) throw new Error("cannot pack candidate");
          const metadata = JSON.parse(packed.stdout.toString());
          const entry = Array.isArray(metadata)
            ? metadata[0] : Object.values(metadata)[0];
          const bytes = await Bun.file(`.artifacts/testing/ci/${entry.filename}`).bytes();
          const hash = createHash("sha256").update(bytes).digest("hex");
          if (hash !== process.env.HANA_CANDIDATE_SHA256)
            throw new Error("candidate tarball differs from approved hash");
          await Bun.write(".artifacts/testing/ci/approved-package.json", JSON.stringify({
            version: pkg.version, sha256: hash, integrity: entry.integrity, tag: pre.tag
          }));
          '

      - name: Create release PR or publish
        if:
          ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch'
          && (inputs.mode == 'publish' || inputs.mode == 'candidate')) }}
        uses: changesets/action@v2.1.2
        with:
          version-script: bun run version-packages
          publish-script: bun run release:checked
          create-github-releases: ${{ inputs.mode != 'candidate' }}
          push-git-tags: ${{ inputs.mode != 'candidate' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-${{ github.sha }}
          path: .artifacts/testing/**
          include-hidden-files: true
          retention-days: 90
