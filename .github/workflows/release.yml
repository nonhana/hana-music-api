name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      mode:
        description: Release workflow mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - candidate
          - publish
      candidate_version:
        description: Exact version approved for candidate publication
        type: string
      candidate_sha256:
        description: SHA-256 of the approved npm tarball
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.plan.outputs.route }}
      version: ${{ steps.plan.outputs.version }}
      patch: ${{ steps.plan.outputs.patch }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - id: plan
        env:
          MODE: ${{ inputs.mode }}
          APPROVED_VERSION: ${{ inputs.candidate_version }}
          APPROVED_HASH: ${{ inputs.candidate_sha256 }}
        run: bun scripts/plan-release.mts
      - if: steps.plan.outputs.patch == 'true'
        run: |
          git add -A -- .changeset CHANGELOG.md package.json bun.lock
          git diff --cached --binary HEAD > "$RUNNER_TEMP/version.patch"
          test -s "$RUNNER_TEMP/version.patch"
      - if: steps.plan.outputs.patch == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: version-patch
          path: ${{ runner.temp }}/version.patch

  version:
    needs: plan
    if: needs.plan.outputs.route == 'version'
    concurrency: release-version-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v2.1.2
        with:
          version-script: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    needs: plan
    uses: ./.github/workflows/verify.yml
    with:
      release_candidate: ${{ needs.plan.outputs.route == 'candidate' }}
      version_patch: ${{ needs.plan.outputs.patch == 'true' }}

  mutation:
    needs: plan
    if: needs.plan.outputs.route == 'candidate'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/apply-version
        if: needs.plan.outputs.patch == 'true'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - if: matrix.target == 'watchman'
        run: bunx playwright install --with-deps chromium
      - name: Test every registered mutation in this target
        env:
          TARGET: ${{ matrix.target }}
        run: bun scripts/mutation-test.mts --target "$TARGET"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ github.sha }}-${{ matrix.target }}
          path: .artifacts/testing/mutation/**
          include-hidden-files: true
          retention-days: 90

  rehearse:
    needs: [plan, checks, mutation]
    if: needs.plan.outputs.route == 'candidate' && inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-package
      - name: Verify a mismatched digest cannot reach publication
        env:
          MODE: dry-run
          EXPECTED_SHA256: intentional-mismatch
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if bun scripts/publish-archive.mts > .artifacts/testing/ci/mismatch.log 2>&1; then
            exit 1
          fi
          grep -F 'Verified archive digest mismatch' .artifacts/testing/ci/mismatch.log
      - name: Exercise verified archive publication without uploading
        env:
          MODE: dry-run
          EXPECTED_SHA256: ${{ needs.checks.outputs.sha256 }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: bun scripts/publish-archive.mts 2>&1 | tee .artifacts/testing/ci/publish.log

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-${{ github.sha }}
          path: |
            .artifacts/testing/ci/*.log
            .artifacts/testing/ci/*.json
          include-hidden-files: true
          retention-days: 90

  release:
    needs: [plan, checks, mutation]
    if: needs.plan.outputs.route == 'candidate' && inputs.mode != 'dry-run'
    runs-on: ubuntu-latest
    concurrency: release-npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/apply-version
        if: needs.plan.outputs.patch == 'true'
      - uses: ./.github/actions/restore-package
      - name: Check approved candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'candidate' }}
        env:
          HANA_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          HANA_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          bun -e '
          import { createHash } from "node:crypto";
          const pkg = await Bun.file("package.json").json();
          const pre = await Bun.file(".changeset/pre.json").json();
          const active = [...new Bun.Glob("*.md").scanSync({ cwd: ".changeset" })]
            .filter(path => path !== "README.md");
          if (
            pkg.version !== process.env.HANA_CANDIDATE_VERSION ||
            !/^\d+\.\d+\.\d+-next\.\d+$/.test(pkg.version) ||
            pre.mode !== "pre" ||
            pre.tag !== "next" ||
            active.length ||
            pkg.publishConfig?.provenance !== true
          ) throw new Error("candidate version, tag or Changesets state is not approved");
          const bytes = await Bun.file(".artifacts/testing/ci/verified.tgz").bytes();
          const hash = createHash("sha256").update(bytes).digest("hex");
          if (hash !== process.env.HANA_CANDIDATE_SHA256)
            throw new Error("candidate tarball differs from approved hash");
          await Bun.write(".artifacts/testing/ci/approved-package.json", JSON.stringify({
            version: pkg.version, sha256: hash, tag: pre.tag
          }));
          '

      - name: Refuse a conflicting stable tag before uploading
        if: inputs.mode != 'candidate'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="refs/tags/v$VERSION"
          if git rev-parse -q --verify "$tag" >/dev/null; then
            test "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA"
          fi
      - name: Publish the verified archive
        env:
          MODE: ${{ inputs.mode || 'publish' }}
          EXPECTED_SHA256: ${{ needs.checks.outputs.sha256 }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: bun scripts/publish-archive.mts 2>&1 | tee .artifacts/testing/ci/publish.log
      - name: Record stable GitHub release
        if: inputs.mode != 'candidate' && inputs.mode != 'dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            awk -v title="## $VERSION" '$0 == title {found=1;next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            test -s "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-${{ github.sha }}
          path: |
            .artifacts/testing/ci/*.log
            .artifacts/testing/ci/*.json
          include-hidden-files: true
          retention-days: 90
