name: verify

on:
  workflow_call:
    outputs:
      sha256:
        description: SHA-256 of the package verified offline and live
        value: ${{ jobs.verify.outputs.sha256 }}
    inputs:
      release_candidate:
        type: boolean
        default: false
      version_patch:
        type: boolean
        default: false
      evidence_failure:
        description: Intentionally fail a native test to validate artifact upload
        type: boolean
        default: false
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    outputs:
      package_sha256: ${{ steps.seal.outputs.sha256 }}
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [static, docs, source-a, source-b, package]
    env:
      LANE: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/apply-version
        if: inputs.version_patch

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pin candidate packer
        if: inputs.release_candidate && matrix.lane == 'package'
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for offline browser verification
        if: matrix.lane == 'package'
        run: bunx playwright install --with-deps chromium

      - name: Record checked out candidate
        run: |
          mkdir -p .artifacts/testing/ci
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git status --porcelain=v1 --untracked-files=all > .artifacts/testing/ci/source-before
          fi
          git rev-parse HEAD > .artifacts/testing/ci/tested-head.txt
          bun -e 'import { fingerprint } from "./tests/_kit/evidence.ts"; await Bun.write(".artifacts/testing/ci/initial-candidate.json", JSON.stringify(await fingerprint()));'

      - name: Exercise artifact upload after an intentional test failure
        if: inputs.evidence_failure && matrix.lane == 'static'
        run: |
          mkdir -p .artifacts/testing/ci
          cat > .artifacts/testing/ci/failure-probe.test.ts <<'TEST'
          import { expect, test } from 'bun:test';
          test('intentional artifact upload failure', () => {
            expect('failure probe').toBe('normal verification');
          });
          TEST
          bun test ./.artifacts/testing/ci/failure-probe.test.ts --reporter=junit --reporter-outfile=.artifacts/testing/ci/failure-probe.xml 2>&1 | tee .artifacts/testing/ci/failure-probe.log

      - name: Check generated files, contracts, types and style
        if: matrix.lane == 'static'
        run: |
          exec > >(tee .artifacts/testing/ci/static.log) 2>&1
          bun run types:modules:check
          bun run inputs:check
          bun run failures:check
          bun run typecheck
          bun run lint
          bun run spell
          bun run fmt:check

      - name: Check fixtures, load and docs
        if: matrix.lane == 'docs'
        run: |
          exec > >(tee .artifacts/testing/ci/docs.log) 2>&1
          bun run verify:fixtures
          bun scripts/load-test.mts
          bun run docs:build

      - name: Run isolated source tests
        if: startsWith(matrix.lane, 'source-')
        run: bun scripts/test.mts "ci-$LANE" 2>&1 | tee .artifacts/testing/ci/tests.log

      - name: Build and test package consumers
        if: matrix.lane == 'package'
        run: bun scripts/test.mts ci-package 2>&1 | tee .artifacts/testing/ci/package.log

      - name: Inspect the tested build and run browser and transport contracts
        if: matrix.lane == 'package'
        run: |
          exec > >(tee .artifacts/testing/ci/dist.log) 2>&1
          bun run check:dist
          bun scripts/test.mts ci-built

      - name: Verify anonymous live against the tested package
        id: seal
        if: inputs.release_candidate && matrix.lane == 'package'
        env:
          LIVE_UPSTREAM: '1'
          HANA_LIVE_SUITE: anonymous
        run: |
          bun run test:live
          bun scripts/seal-release.mts
          echo "sha256=$(cat .artifacts/testing/release/sha256)" >> "$GITHUB_OUTPUT"

      - name: Record completed lane
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git status --porcelain=v1 --untracked-files=all > .artifacts/testing/ci/source-after
          fi
          git rev-parse HEAD > .artifacts/testing/ci/completed

      - name: Upload test evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testing-${{ github.sha }}-${{ matrix.lane }}
          path: .artifacts/testing/**
          include-hidden-files: true
          retention-days: ${{ (inputs.release_candidate || github.event_name == 'workflow_dispatch') && 90 || 30 }}

  verify:
    outputs:
      sha256: ${{ steps.sealed.outputs.sha256 }}
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane to succeed
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v8
        with:
          pattern: testing-${{ github.sha }}-*
          path: ${{ runner.temp }}/ci-results
      - name: Verify complete test inventory
        id: inventory
        run: bun scripts/check-ci-coverage.mts "$RUNNER_TEMP/ci-results" "$GITHUB_SHA"
      # The planner reads this successful step from the matching verify attempt.
      - name: Verified PR ${{ github.event.number }} tree ${{ steps.inventory.outputs.tree }}
        if: github.event_name == 'pull_request' && steps.inventory.outputs.tree != ''
        run: echo "All lanes tested the clean merge tree."
      - name: Record verified package digest
        if: inputs.release_candidate
        id: sealed
        env:
          PRODUCER_SHA256: ${{ needs.checks.outputs.package_sha256 }}
        run: |
          cd "$RUNNER_TEMP/ci-results/testing-$GITHUB_SHA-package/release"
          hash=$(sha256sum verified.tgz | cut -d' ' -f1)
          test "$hash" = "$PRODUCER_SHA256"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
