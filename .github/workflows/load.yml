name: local upstream soak

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Record checked out candidate
        run: |
          mkdir -p .artifacts/testing/ci
          git rev-parse HEAD > .artifacts/testing/ci/tested-head.txt
          bun -e 'import { fingerprint } from "./tests/_kit/evidence.ts"; await Bun.write(".artifacts/testing/ci/initial-candidate.json", JSON.stringify(await fingerprint()));'

      - run: bun run test:load:soak 2>&1 | tee .artifacts/testing/ci/soak.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-load-${{ github.sha }}
          path: .artifacts/testing/**
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 90 || 30 }}
