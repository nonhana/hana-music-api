name: mutation

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      - name: Install Chromium for offline browser verification
        run: bunx playwright install --with-deps chromium
      - name: Record checked out candidate
        run: |
          mkdir -p .artifacts/testing/ci
          git rev-parse HEAD > .artifacts/testing/ci/tested-head.txt
          bun -e 'import { fingerprint } from "./tests/_kit/evidence.ts"; await Bun.write(".artifacts/testing/ci/initial-candidate.json", JSON.stringify(await fingerprint()));'

      - run: bun scripts/mutation-test.mts --all 2>&1 | tee .artifacts/testing/ci/mutation.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ github.sha }}
          path: .artifacts/testing/**
          include-hidden-files: true
          retention-days: 90
